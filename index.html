<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Loomi 3D Mannequin V1</title><style>
:root{--bg:#090b0d;--panel:#14191d;--line:#303941;--text:#f5f7f8;--muted:#aab3b8;--accent:#ff5b48}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#11161a;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand b{color:var(--accent)}.status{font-size:12px;color:#77d6ad}.stage{position:relative;min-height:0;overflow:hidden;touch-action:none;background:#030405}#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#canvasWrap{position:absolute;inset:0}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;pointer-events:none}.empty b{display:block;color:#fff;font-size:21px;margin-bottom:7px}.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.top>*{pointer-events:auto}.file{position:relative;display:inline-flex}.file input{position:absolute;inset:0;opacity:0}.btn{border:1px solid #47535b;background:#10161acb;color:#fff;border-radius:12px;padding:10px 13px}.btn.primary{background:var(--accent);border-color:transparent}.hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:4;background:#10161ac7;border:1px solid #3d4850;border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap;pointer-events:none}.bottom{background:#101519;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.modes,.presets{display:grid;gap:8px}.modes{grid-template-columns:repeat(3,1fr)}.presets{grid-template-columns:repeat(4,1fr);margin-top:8px}.modes button,.presets button{border:1px solid #44515a;background:#20272c;color:#fff;border-radius:12px;padding:11px 8px}.presets button{padding:8px 5px;font-size:12px}.modes button.active{background:var(--accent);border-color:transparent}.panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);gap:10px}.panel.open{display:grid}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.row label{font-size:13px}.row input{width:150px}.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.toggle{font-size:12px;display:flex;gap:7px;align-items:center}@media(min-width:850px){.app{max-width:1100px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.bottom{display:grid;grid-template-columns:390px 1fr;gap:14px}.panel{display:grid;margin-top:0;padding-top:0;border-top:0}}
</style></head><body><div class="app"><header><div class="brand">Loomi 3D <b>Mannequin V1</b></div><div class="status">Prêt</div></header><section id="stage" class="stage"><img id="photo" alt=""><div id="canvasWrap"></div><div class="top"><label class="file btn primary">📷 Photo<input id="file" type="file" accept="image/*"></label><div><button id="reset" class="btn">↺</button><button id="settings" class="btn">⚙️</button><button id="export" class="btn">Exporter</button></div></div><div id="hint" class="hint">Glisse pour déplacer le mannequin</div><div id="empty" class="empty"><div><b>Ajoute une photo</b>Le mannequin Loomis apparaîtra au centre.</div></div></section><footer class="bottom"><div><div class="modes"><button class="mode active" data-mode="move">Déplacer</button><button class="mode" data-mode="rotate">Tourner 3D</button><button class="mode" data-mode="scale">Taille</button></div><div class="presets"><button data-preset="front">Face</button><button data-preset="three">3/4</button><button data-preset="profile">Profil</button><button data-preset="back">Dos</button></div></div><div id="panel" class="panel"><div class="row"><label>Transparence</label><input id="opacity" type="range" min="15" max="100" value="82"></div><div class="row"><label>Largeur tête</label><input id="headWidth" type="range" min="75" max="125" value="100"></div><div class="row"><label>Hauteur tête</label><input id="headHeight" type="range" min="75" max="125" value="100"></div><div class="row"><label>Longueur mâchoire</label><input id="jaw" type="range" min="70" max="140" value="100"></div><div class="toggles"><label class="toggle"><input id="showSkull" type="checkbox" checked> Crâne</label><label class="toggle"><input id="showSide" type="checkbox" checked> Plan latéral</label><label class="toggle"><input id="showGuides" type="checkbox" checked> Repères</label><label class="toggle"><input id="showJaw" type="checkbox" checked> Mâchoire</label></div></div></footer></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";const $=id=>document.getElementById(id),stage=$("stage"),wrap=$("canvasWrap"),photo=$("photo"),empty=$("empty"),hint=$("hint");const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-4,4,4,-4,.1,100);camera.position.set(0,0,10);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);wrap.appendChild(renderer.domElement);const mannequin=new THREE.Group();scene.add(mannequin);const skullGroup=new THREE.Group(),sideGroup=new THREE.Group(),guideGroup=new THREE.Group(),jawGroup=new THREE.Group();mannequin.add(skullGroup,sideGroup,guideGroup,jawGroup);let mats=[],shape={w:1,h:1,j:1};function mat(c=0xff5b48){const m=new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.82,depthTest:false,depthWrite:false});mats.push(m);return m}function clear(g){while(g.children.length){const o=g.children.pop();o.geometry?.dispose()}}function line(g,pts,c){const o=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat(c));o.renderOrder=5;g.add(o)}function ellipse(rx,ry,z=0,n=120){const a=[];for(let i=0;i<=n;i++){const t=i/n*Math.PI*2;a.push(new THREE.Vector3(Math.cos(t)*rx,Math.sin(t)*ry,z))}return a}function bez(a,b,c,d){return new THREE.CubicBezierCurve3(a,b,c,d).getPoints(55)}function build(){mats=[];[skullGroup,sideGroup,guideGroup,jawGroup].forEach(clear);const rx=1.72*shape.w,ry=1.95*shape.h;line(skullGroup,ellipse(rx,ry,0),0xff5b48);line(skullGroup,ellipse(rx,ry,0).map(p=>new THREE.Vector3(0,p.y,p.x)),0xff7f70);line(skullGroup,ellipse(rx,ry,0).map(p=>new THREE.Vector3(p.x,0,p.y)),0xff9b8f);const sx=rx*.74,sr=.72*Math.min(shape.w,shape.h);line(sideGroup,ellipse(sr*.72,sr,0).map(p=>new THREE.Vector3(-sx,p.y,p.x*.36)),0xffc06b);line(sideGroup,ellipse(sr*.72,sr,0).map(p=>new THREE.Vector3(sx,p.y,p.x*.36)),0xffc06b);[.16,-.24,-.77,-1.17].forEach((y,i)=>{const width=rx*(i<2?.98:.82),pts=[];for(let k=0;k<=65;k++){const t=k/65;pts.push(new THREE.Vector3(-width+2*width*t,y,.14*Math.sin(Math.PI*t)))}line(guideGroup,pts,i===1?0x70bfff:0xff8f82)});line(guideGroup,[new THREE.Vector3(0,ry,0),new THREE.Vector3(0,-2.82*shape.j,0)],0x70dcae);const jy=-1.8*shape.j,cy=-2.62*shape.j,jx=1.12*shape.w;line(jawGroup,bez(new THREE.Vector3(-rx*.79,-.02,0),new THREE.Vector3(-rx*.83,-.72,0),new THREE.Vector3(-jx,jy,0),new THREE.Vector3(0,cy,0)),0xff5b48);line(jawGroup,bez(new THREE.Vector3(rx*.79,-.02,0),new THREE.Vector3(rx*.83,-.72,0),new THREE.Vector3(jx,jy,0),new THREE.Vector3(0,cy,0)),0xff5b48);vis();opacity()}function vis(){skullGroup.visible=$("showSkull").checked;sideGroup.visible=$("showSide").checked;guideGroup.visible=$("showGuides").checked;jawGroup.visible=$("showJaw").checked}function opacity(){const o=+$("opacity").value/100;mats.forEach(m=>m.opacity=o)}build();let mode="move",drag=false,start={},startPos=new THREE.Vector3(),startRot=new THREE.Euler(),startScale=1;function setMode(m){mode=m;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));hint.textContent=m==="move"?"Glisse pour déplacer le mannequin":m==="rotate"?"Glisse pour tourner la tête en 3D":"Glisse verticalement ou pince avec deux doigts"}document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function xy(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}stage.onpointerdown=e=>{if(e.target.closest("button,label,input"))return;drag=true;start=xy(e);startPos.copy(mannequin.position);startRot.copy(mannequin.rotation);startScale=mannequin.scale.x;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!drag)return;const p=xy(e),dx=p.x-start.x,dy=p.y-start.y;if(mode==="move"){mannequin.position.x=startPos.x+dx*8;mannequin.position.y=startPos.y-dy*8}else if(mode==="rotate"){mannequin.rotation.y=startRot.y+dx*Math.PI*1.5;mannequin.rotation.x=startRot.x+dy*Math.PI}else{const s=Math.max(.25,Math.min(3,startScale-dy*2.7));mannequin.scale.setScalar(s)}};stage.onpointerup=()=>drag=false;stage.onpointercancel=()=>drag=false;document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{mannequin.rotation.set(0,0,0);if(b.dataset.preset==="three")mannequin.rotation.set(-.05,.62,-.04);if(b.dataset.preset==="profile")mannequin.rotation.set(0,1.48,0);if(b.dataset.preset==="back")mannequin.rotation.set(0,Math.PI,0)});$("file").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.src=r.result;empty.style.display="none"};r.readAsDataURL(f)};$("settings").onclick=()=>$("panel").classList.toggle("open");["showSkull","showSide","showGuides","showJaw"].forEach(id=>$(id).oninput=vis);$("opacity").oninput=opacity;$("headWidth").oninput=()=>{shape.w=+$("headWidth").value/100;build()};$("headHeight").oninput=()=>{shape.h=+$("headHeight").value/100;build()};$("jaw").oninput=()=>{shape.j=+$("jaw").value/100;build()};$("reset").onclick=()=>{mannequin.position.set(0,0,0);mannequin.rotation.set(0,0,0);mannequin.scale.setScalar(1);shape={w:1,h:1,j:1};$("headWidth").value=100;$("headHeight").value=100;$("jaw").value=100;$("opacity").value=82;build();setMode("move")};$("export").onclick=()=>{renderer.render(scene,camera);const out=document.createElement("canvas");out.width=renderer.domElement.width;out.height=renderer.domElement.height;const c=out.getContext("2d");if(photo.src){const ar=photo.naturalWidth/photo.naturalHeight,sr=out.width/out.height;let dw,dh,dx,dy;if(ar>sr){dw=out.width;dh=dw/ar;dx=0;dy=(out.height-dh)/2}else{dh=out.height;dw=dh*ar;dy=0;dx=(out.width-dw)/2}c.drawImage(photo,dx,dy,dw,dh)}c.drawImage(renderer.domElement,0,0,out.width,out.height);const a=document.createElement("a");a.download="loomi-3d-mannequin.png";a.href=out.toDataURL("image/png");a.click()};function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h,false);const v=4,ar=w/h;camera.left=-v*ar;camera.right=v*ar;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(wrap);resize();(function anim(){requestAnimationFrame(anim);renderer.render(scene,camera)})();
</script></body></html>
