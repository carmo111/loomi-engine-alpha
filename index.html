<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loomi 3D Editor V1</title>
<style>
:root{--bg:#090b0d;--panel:#14191d;--line:#344047;--text:#f7f8f9;--muted:#a7b0b5;--accent:#ff563d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#101519;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px}header b{color:var(--accent)}.badge{font-size:12px;border:1px solid #456;border-radius:999px;padding:7px 10px}
.app{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 62px)}aside{padding:15px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
main{padding:9px;min-width:0}.stage{position:relative;height:calc(100vh - 80px);min-height:620px;background:#030405;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#canvasWrap{position:absolute;inset:0}
.block+.block{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}h2{font-size:14px;margin:0 0 9px}
.file{display:block;position:relative}.file span{display:block;text-align:center;background:var(--accent);padding:13px;border-radius:9px;font-weight:800}.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:1px solid #46535b;background:#222a30;color:#fff;border-radius:9px;padding:10px;cursor:pointer}button.active{background:var(--accent)}
.control{display:grid;gap:5px;margin-bottom:10px;font-size:12px}.control input{width:100%}.checks{display:grid;gap:8px;font-size:13px}
.note{font-size:12px;line-height:1.45;color:#cbd2d5;background:#1b2227;border:1px solid #303a40;padding:10px;border-radius:8px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:25px}.empty b{display:block;color:#fff;font-size:20px;margin-bottom:6px}
.toolbar{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;gap:7px;background:#0c1013dd;border:1px solid #3b464d;border-radius:12px;padding:7px;z-index:4}
.toolbar button{padding:8px 11px}
@media(max-width:780px){.app{display:block}.stage{height:68vh;min-height:500px}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><h1>Loomi 3D Editor <b>V1</b></h1><span id="badge" class="badge">Initialisation…</span></header>
<div class="app">
<aside>
<section class="block"><h2>1. Portrait</h2><label class="file"><span>📷 Choisir une photo</span><input id="file" type="file" accept="image/*"></label><div class="grid" style="margin-top:8px"><button id="reset">Réinitialiser</button><button id="export">Exporter PNG</button></div></section>
<section class="block"><h2>2. Orientation</h2><div class="grid"><button data-preset="front">Face</button><button data-preset="three">3/4</button><button data-preset="profile">Profil</button><button data-preset="back">Dos</button></div></section>
<section class="block"><h2>3. Manipulation</h2><div class="grid"><button class="mode active" data-mode="translate">Déplacer</button><button class="mode" data-mode="rotate">Tourner</button><button class="mode" data-mode="scale">Taille</button><button id="local">Axes locaux</button></div></section>
<section class="block"><h2>4. Forme</h2>
<label class="control">Opacité<input id="opacity" type="range" min="10" max="100" value="88"></label>
<label class="control">Largeur du crâne<input id="skullWidth" type="range" min="75" max="130" value="100"></label>
<label class="control">Hauteur du crâne<input id="skullHeight" type="range" min="75" max="130" value="100"></label>
<label class="control">Longueur de la mâchoire<input id="jawLength" type="range" min="65" max="145" value="100"></label>
<label class="control">Largeur de la mâchoire<input id="jawWidth" type="range" min="65" max="140" value="100"></label>
</section>
<section class="block"><h2>5. Visibilité</h2><div class="checks">
<label><input id="showSphere" type="checkbox" checked> Sphère crânienne</label>
<label><input id="showSide" type="checkbox" checked> Plans latéraux</label>
<label><input id="showAxis" type="checkbox" checked> Axe central</label>
<label><input id="showGuides" type="checkbox" checked> Repères horizontaux</label>
<label><input id="showJaw" type="checkbox" checked> Mâchoire</label>
</div></section>
<section class="block"><p class="note">Importe une photo, choisis une orientation, puis utilise les poignées colorées pour déplacer, tourner et redimensionner la structure.</p></section>
</aside>
<main><div class="stage" id="stage"><img id="photo" alt=""><div id="canvasWrap"></div><div id="empty" class="empty"><div><b>Structure Loomis 3D</b>Importe une photo pour commencer.</div></div><div class="toolbar"><button class="mode active" data-mode="translate">Déplacer</button><button class="mode" data-mode="rotate">Tourner</button><button class="mode" data-mode="scale">Taille</button></div></div></main>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import { TransformControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/TransformControls.js/+esm";
const $=id=>document.getElementById(id),wrap=$("canvasWrap"),stage=$("stage"),photo=$("photo"),empty=$("empty");
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-5,5,5,-5,.1,100);camera.position.set(0,0,12);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);wrap.appendChild(renderer.domElement);
const head=new THREE.Group();scene.add(head);
const sphereGroup=new THREE.Group(),sideGroup=new THREE.Group(),guideGroup=new THREE.Group(),jawGroup=new THREE.Group();head.add(sphereGroup,sideGroup,guideGroup,jawGroup);
const mats=[];
function mat(c){const m=new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.88,depthTest:false,depthWrite:false});mats.push(m);return m}
function ellipse(rx,ry,z=0,n=150){const p=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;p.push(new THREE.Vector3(Math.cos(a)*rx,Math.sin(a)*ry,z))}return p}
function line(g,p,c){const o=new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),mat(c));o.renderOrder=5;g.add(o);return o}
function clear(g){while(g.children.length){const o=g.children.pop();o.geometry?.dispose()}}
let d={sw:1,sh:1,jl:1,jw:1};
function rebuild(){
 clear(sphereGroup);clear(sideGroup);clear(guideGroup);clear(jawGroup);
 const rx=2.25*d.sw,ry=2.45*d.sh;
 line(sphereGroup,ellipse(rx,ry),0xff563d);
 line(sphereGroup,ellipse(rx,ry).map(p=>new THREE.Vector3(0,p.y,p.x)),0xff7d68);
 line(sphereGroup,ellipse(rx,ry).map(p=>new THREE.Vector3(p.x,0,p.y)),0xff9a88);
 const sr=.85*Math.min(d.sw,d.sh),sx=rx*.76;
 line(sideGroup,ellipse(sr*.78,sr).map(p=>new THREE.Vector3(-sx,p.y,p.x*.42)),0xefb85f);
 line(sideGroup,ellipse(sr*.78,sr).map(p=>new THREE.Vector3(sx,p.y,p.x*.42)),0xefb85f);
 [.15,-.28,-1.08,-1.55].forEach((y,i)=>{const w=rx*(i<2?.98:.72),p=[];for(let s=0;s<=80;s++){const t=s/80;p.push(new THREE.Vector3(-w+2*w*t,y,.2*Math.sin(t*Math.PI)))}line(guideGroup,p,i===1?0x4db4ff:0xff9a88)});
 line(guideGroup,[new THREE.Vector3(0,ry,0),new THREE.Vector3(0,-ry-1.7*d.jl,0)],0x60d7a7);
 const curve=(a,b,c,e)=>new THREE.CubicBezierCurve3(a,b,c,e).getPoints(70),jy=-2.2*d.jl,cy=-3.15*d.jl,jx=1.52*d.jw;
 line(jawGroup,curve(new THREE.Vector3(-rx*.8,-.05,0),new THREE.Vector3(-rx*.88,-.8,0),new THREE.Vector3(-jx,jy,0),new THREE.Vector3(0,cy,0)),0xff563d);
 line(jawGroup,curve(new THREE.Vector3(rx*.8,-.05,0),new THREE.Vector3(rx*.88,-.8,0),new THREE.Vector3(jx,jy,0),new THREE.Vector3(0,cy,0)),0xff563d);
 visible();
}
function visible(){sphereGroup.visible=$("showSphere").checked;sideGroup.visible=$("showSide").checked;jawGroup.visible=$("showJaw").checked;guideGroup.children.forEach((c,i)=>c.visible=i===4?$("showAxis").checked:$("showGuides").checked)}
rebuild();
const tc=new TransformControls(camera,renderer.domElement);tc.attach(head);scene.add(tc.getHelper());tc.setMode("translate");tc.setSize(.8);
function mode(m){tc.setMode(m);document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m))}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>mode(b.dataset.mode)));
let local=false;$("local").addEventListener("click",()=>{local=!local;tc.setSpace(local?"local":"world");$("local").classList.toggle("active",local)});
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{head.rotation.set(0,0,0);if(b.dataset.preset==="three")head.rotation.set(-.08,.66,-.05);if(b.dataset.preset==="profile")head.rotation.y=1.43;if(b.dataset.preset==="back")head.rotation.y=Math.PI}));
["showSphere","showSide","showAxis","showGuides","showJaw"].forEach(id=>$(id).addEventListener("input",visible));
$("opacity").addEventListener("input",()=>mats.forEach(m=>m.opacity=+$("opacity").value/100));
["skullWidth","skullHeight","jawLength","jawWidth"].forEach(id=>$(id).addEventListener("input",()=>{d.sw=+$("skullWidth").value/100;d.sh=+$("skullHeight").value/100;d.jl=+$("jawLength").value/100;d.jw=+$("jawWidth").value/100;rebuild()}));
$("file").addEventListener("change",e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.src=r.result;empty.style.display="none"};r.readAsDataURL(f)});
$("reset").addEventListener("click",()=>{head.position.set(0,0,0);head.rotation.set(0,0,0);head.scale.set(1,1,1);d={sw:1,sh:1,jl:1,jw:1};["skullWidth","skullHeight","jawLength","jawWidth"].forEach(id=>$(id).value=100);rebuild();mode("translate")});
$("export").addEventListener("click",()=>{renderer.render(scene,camera);const out=document.createElement("canvas");out.width=renderer.domElement.width;out.height=renderer.domElement.height;const c=out.getContext("2d"),box=stage.getBoundingClientRect();if(photo.src){const ar=photo.naturalWidth/photo.naturalHeight,sr=box.width/box.height;let dw,dh,dx,dy;if(ar>sr){dw=out.width;dh=dw/ar;dx=0;dy=(out.height-dh)/2}else{dh=out.height;dw=dh*ar;dy=0;dx=(out.width-dw)/2}c.drawImage(photo,dx,dy,dw,dh)}c.drawImage(renderer.domElement,0,0);const a=document.createElement("a");a.download="loomi-3d-overlay.png";a.href=out.toDataURL("image/png");a.click()});
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h,false);const a=w/h,v=5;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(wrap);resize();
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();$("badge").textContent="Éditeur prêt";
</script>
</body>
</html>
