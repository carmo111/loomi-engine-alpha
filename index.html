<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loomi Engine V3</title>
<style>body{margin:0;background:#0b0e10;color:#fff;font-family:Arial,sans-serif}header{padding:16px 20px;background:#151a1e;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}b{color:#e8b25e}.app{display:grid;grid-template-columns:280px 1fr 320px;min-height:calc(100vh - 70px)}aside{padding:16px;background:#151a1e}.work{padding:12px;background:#080a0c}.stage{height:75vh;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:12px;background:#050607;position:relative;overflow:hidden}canvas{max-width:100%;max-height:100%}.file{position:relative;display:block;background:#e8b25e;color:#15110b;padding:14px;border-radius:10px;text-align:center;font-weight:bold;cursor:pointer}.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}button{padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{background:#222;padding:10px;border-left:4px solid #e8b25e;border-radius:8px;font-size:13px}.settings label,.checks label{display:block;margin:9px 0;font-size:13px}.settings input[type=range]{width:100%}.badge{padding:8px 12px;border:1px solid #555;border-radius:999px}.ok{color:#54d5a0}.err{color:#ff8080}.loader{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}.hidden{display:none}.right{border-left:1px solid #333}.pose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pose div{background:#222;padding:8px;text-align:center;border-radius:8px}.pose strong{display:block;font-size:18px}@media(max-width:1000px){.app{grid-template-columns:260px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.app{display:block}.stage{height:60vh}}</style></head><body>
<header><h1>Loomi Engine <b>V3</b></h1><span id="badge" class="badge">Chargement…</span></header>
<div class="app"><aside><h3>Photo</h3><label class="file">📷 Importer une photo<input id="file" type="file" accept="image/*"></label><p id="status" class="status">Choisis une photo.</p><div class="grid"><button id="analyze" disabled>Analyser</button><button id="manual" disabled>Mode manuel</button><button id="reset" disabled>Réinitialiser</button><button id="export" disabled>Exporter PNG</button></div><h3>Éléments</h3><div class="checks"><label><input id="skull" type="checkbox" checked> Crâne</label><label><input id="side" type="checkbox" checked> Plan latéral</label><label><input id="jaw" type="checkbox" checked> Mâchoire</label><label><input id="axis" type="checkbox" checked> Axe</label><label><input id="eyes" type="checkbox" checked> Yeux</label><label><input id="nose" type="checkbox" checked> Nez</label><label><input id="mouth" type="checkbox" checked> Bouche</label></div><h3>Réglages</h3><div class="settings"><label>Opacité<input id="opacity" type="range" min="20" max="100" value="90"></label><label>Épaisseur<input id="width" type="range" min="1" max="7" value="3"></label><label>Taille<input id="scale" type="range" min="70" max="140" value="100"></label><label>Horizontal<input id="ox" type="range" min="-300" max="300" value="0"></label><label>Vertical<input id="oy" type="range" min="-300" max="300" value="0"></label></div></aside>
<section class="work"><div class="stage"><canvas id="canvas" width="1" height="1"></canvas><div id="empty">Importe une photo pour commencer.</div><div id="loader" class="loader hidden">Analyse du visage…</div></div></section>
<aside class="right"><h3>Orientation</h3><div class="pose"><div>Lacet<strong id="yaw">0°</strong></div><div>Tangage<strong id="pitch">0°</strong></div><div>Roulis<strong id="roll">0°</strong></div></div><p style="color:#aaa;font-size:13px">Le mode manuel demande 8 clics : yeux, nez, menton, tempes, sommet et bouche.</p></aside></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),E={file:$('file'),canvas:$('canvas'),empty:$('empty'),status:$('status'),badge:$('badge'),analyze:$('analyze'),manual:$('manual'),reset:$('reset'),export:$('export'),loader:$('loader'),yaw:$('yaw'),pitch:$('pitch'),roll:$('roll')};['skull','side','jaw','axis','eyes','nose','mouth','opacity','width','scale','ox','oy'].forEach(id=>E[id]=$(id));const c=E.canvas.getContext('2d');let img=null,name='loomi',mesh=null,ready=false,fit=null,manual=false,pts=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function status(t,cls=''){E.status.textContent=t;E.status.className='status '+cls}function enable(){[E.analyze,E.manual,E.reset,E.export].forEach(b=>b.disabled=false)}function build(a){const eyes=mid(a.el,a.er),fw=dist(a.tl,a.tr),fh=dist(a.top,a.ch),es=dist(a.el,a.er),roll=Math.atan2(a.er.y-a.el.y,a.er.x-a.el.x),yaw=clamp((a.no.x-eyes.x)/(es*.45),-.9,.9)*.7,pitch=clamp((dist(a.top,eyes)/Math.max(1,dist(eyes,a.ch))-.72)*.8,-.5,.5),center={x:eyes.x,y:eyes.y-fh*.22};return{a,center,rx:fw*.53,ry:fh*.49,yaw,pitch,roll,eye:(eyes.y-center.y)/(fh*.49),nose:(a.no.y-center.y)/(fh*.49),mouth:(a.mo.y-center.y)/(fh*.49),chin:(a.ch.y-center.y)/(fh*.49)}}function fromLM(l){const P=i=>({x:l[i].x*E.canvas.width,y:l[i].y*E.canvas.height});return build({el:mid(P(33),P(133)),er:mid(P(362),P(263)),no:P(1),ch:P(152),tl:P(234),tr:P(454),top:P(10),mo:P(13)})}function rot(v,y,p,r){let{x,y:yy,z}=v,co=Math.cos(y),si=Math.sin(y);[x,z]=[co*x+si*z,-si*x+co*z];co=Math.cos(p);si=Math.sin(p);[yy,z]=[co*yy-si*z,si*yy+co*z];co=Math.cos(r);si=Math.sin(r);[x,yy]=[co*x-si*yy,si*x+co*yy];return{x,y:yy,z}}function P(v){const s=+E.scale.value/100,q=rot({x:v.x*fit.rx*s,y:v.y*fit.ry*s,z:v.z*fit.rx*.9*s},fit.yaw,fit.pitch,fit.roll);return{x:fit.center.x+q.x+(+E.ox.value),y:fit.center.y+q.y+(+E.oy.value),z:q.z}}function path(points,color,dash=[]){c.save();c.strokeStyle=color;c.lineWidth=+E.width.value;c.globalAlpha=+E.opacity.value/100;c.setLineDash(dash);c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.restore()}function ring(y,color){const r=Math.sqrt(Math.max(.02,1-y*y)),a=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;a.push(P({x:r*Math.cos(t),y,z:r*Math.sin(t)}))}path(a,color)}function draw(){if(!img)return;c.clearRect(0,0,E.canvas.width,E.canvas.height);c.drawImage(img,0,0,E.canvas.width,E.canvas.height);if(!fit)return;if(E.skull.checked){let a=[];for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;a.push(P({x:Math.cos(t),y:Math.sin(t),z:0}))}path(a,'#f2eee4');ring(0,'#f2eee4')}if(E.side.checked){let a=[];const d=Math.sin(fit.yaw)>=0?.55:-.55,r=Math.sqrt(1-d*d);for(let i=0;i<=100;i++){const t=i/100*Math.PI*2;a.push(P({x:d,y:r*Math.cos(t),z:r*Math.sin(t)}))}path(a,'#9d6cff')}if(E.axis.checked){let a=[];for(let i=0;i<=100;i++){const t=(i/100-.5)*Math.PI;a.push(P({x:Math.sin(t),y:Math.cos(t),z:0}))}path(a,'#54d5a0')}if(E.eyes.checked)ring(fit.eye,'#4db4ff');if(E.nose.checked)ring(fit.nose,'#54d5a0');if(E.mouth.checked)ring(fit.mouth,'#ff759f');if(E.jaw.checked)path([P({x:-.72,y:.15,z:.15}),P({x:-.62,y:.72,z:.12}),P({x:0,y:fit.chin+.1,z:.3}),P({x:.62,y:.72,z:.12}),P({x:.72,y:.15,z:.15})],'#ff759f');E.yaw.textContent=Math.round(fit.yaw*180/Math.PI)+'°';E.pitch.textContent=Math.round(fit.pitch*180/Math.PI)+'°';E.roll.textContent=Math.round(fit.roll*180/Math.PI)+'°'}E.file.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader;r.onerror=()=>status('Impossible de lire la photo.','err');r.onload=()=>{const im=new Image;im.onerror=()=>status('Format non pris en charge. Essaie JPEG ou PNG.','err');im.onload=()=>{img=im;name=(f.name||'loomi').replace(/\.[^.]+$/,'');const s=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));E.canvas.width=Math.round(im.naturalWidth*s);E.canvas.height=Math.round(im.naturalHeight*s);E.empty.style.display='none';enable();status('Photo importée. Clique sur Analyser.','ok');draw()};im.src=r.result};r.readAsDataURL(f)};E.analyze.onclick=async()=>{if(!ready)return status('Moteur non prêt. Utilise le mode manuel.','err');E.loader.classList.remove('hidden');try{await mesh.send({image:img})}catch(e){E.loader.classList.add('hidden');status('Analyse impossible. Utilise le mode manuel.','err')}};E.manual.onclick=()=>{manual=true;pts=[];status('Mode manuel : clique œil gauche, œil droit, nez, menton, tempe gauche, tempe droite, sommet, bouche.')};E.canvas.onclick=e=>{if(!manual)return;const r=E.canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*E.canvas.width/r.width,y:(e.clientY-r.top)*E.canvas.height/r.height};pts.push(p);if(pts.length===8){manual=false;fit=build({el:pts[0],er:pts[1],no:pts[2],ch:pts[3],tl:pts[4],tr:pts[5],top:pts[6],mo:pts[7]});status('Calibrage manuel terminé.','ok');draw()}else status('Point '+(pts.length+1)+' sur 8')};E.reset.onclick=()=>{fit=null;draw()};E.export.onclick=()=>{draw();const a=document.createElement('a');a.download=name+'-loomi-v3.png';a.href=E.canvas.toDataURL();a.click()};['skull','side','jaw','axis','eyes','nose','mouth','opacity','width','scale','ox','oy'].forEach(id=>E[id].oninput=draw);async function init(){try{let n=0;while(!window.FaceMesh&&n++<100)await new Promise(r=>setTimeout(r,100));if(!window.FaceMesh)throw 0;mesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/'+f});mesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.45,minTrackingConfidence:.45});mesh.onResults(res=>{E.loader.classList.add('hidden');if(!res.multiFaceLandmarks||!res.multiFaceLandmarks.length)return status('Aucun visage détecté.','err');fit=fromLM(res.multiFaceLandmarks[0]);status('Analyse terminée.','ok');draw()});ready=true;E.badge.textContent='Moteur prêt';E.badge.className='badge ok'}catch(e){E.badge.textContent='Mode manuel';E.badge.className='badge err'}}init()})();
</script></body></html>
