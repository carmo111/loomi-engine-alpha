<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Loomi 3D Skull V2</title>
<style>
:root{
  --bg:#080b0e;--panel:#10161a;--line:#2e3941;--text:#f4f7f8;
  --muted:#aeb8bd;--accent:#ff5b48;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#101519;border-bottom:1px solid var(--line)}
.brand{font-weight:850}.brand b{color:var(--accent)}
.status{font-size:12px;color:#75d3aa}
.stage{position:relative;min-height:0;background:#020304;overflow:hidden;touch-action:none}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
#canvasWrap{position:absolute;inset:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px;pointer-events:none}
.empty b{display:block;color:#fff;font-size:21px;margin-bottom:7px}
.topbar{position:absolute;z-index:6;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.file{position:relative;display:inline-flex}
.file input{position:absolute;inset:0;opacity:0}
.btn{border:1px solid #46535b;background:#10161acc;color:#fff;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}
.btn.primary{background:var(--accent);border-color:transparent}
.tip{position:absolute;z-index:4;top:64px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#0f1519d8;border:1px solid #3d4950;border-radius:999px;padding:7px 12px;font-size:12px;color:#e1e5e7;pointer-events:none}
.bottom{background:#101519;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button,.presets button{border:1px solid #44515a;background:#20272c;color:#fff;border-radius:12px;padding:11px 7px}
.modes button.active{background:var(--accent);border-color:transparent}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.presets button{font-size:12px;padding:8px 5px}
.panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);gap:10px}
.panel.open{display:grid}
.row{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px}
.row label{font-size:13px}.row input[type=range]{width:100%}
.switches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.switches label{font-size:12px;color:#dfe4e6;display:flex;gap:7px;align-items:center}
@media(min-width:850px){
  .app{max-width:1100px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .bottom{display:grid;grid-template-columns:380px 1fr;gap:16px}
  .panel{display:grid;margin:0;padding:0;border:0}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Loomi 3D <b>Skull V2</b></div>
  <div class="status">Crâne renforcé</div>
</header>

<section id="stage" class="stage">
  <img id="photo" alt="">
  <div id="canvasWrap"></div>

  <div class="topbar">
    <label class="file btn primary">📷 Photo<input id="file" type="file" accept="image/*"></label>
    <div style="display:flex;gap:7px">
      <button id="reset" class="btn">↺</button>
      <button id="settings" class="btn">⚙️</button>
      <button id="export" class="btn">Exporter</button>
    </div>
  </div>

  <div id="tip" class="tip">Glisse pour déplacer la tête</div>
  <div id="empty" class="empty"><div><b>Ajoute une photo</b>Puis ajuste le crâne Loomis 3D.</div></div>
</section>

<footer class="bottom">
  <div>
    <div class="modes">
      <button class="mode active" data-mode="move">Déplacer</button>
      <button class="mode" data-mode="rotate">Tourner 3D</button>
      <button class="mode" data-mode="scale">Taille</button>
    </div>
    <div class="presets">
      <button data-preset="front">Face</button>
      <button data-preset="three">3/4</button>
      <button data-preset="profile">Profil</button>
      <button data-preset="back">Dos</button>
    </div>
  </div>

  <div id="panel" class="panel">
    <div class="row"><label for="yaw">Rotation gauche / droite</label><input id="yaw" type="range" min="-180" max="180" value="0"></div>
    <div class="row"><label for="pitch">Inclinaison haut / bas</label><input id="pitch" type="range" min="-90" max="90" value="0"></div>
    <div class="row"><label for="roll">Inclinaison latérale</label><input id="roll" type="range" min="-90" max="90" value="0"></div>
    <div class="row"><label for="opacity">Transparence du volume</label><input id="opacity" type="range" min="8" max="70" value="24"></div>
    <div class="row"><label for="lineOpacity">Force des lignes</label><input id="lineOpacity" type="range" min="20" max="100" value="92"></div>
    <div class="row"><label for="headWidth">Largeur du crâne</label><input id="headWidth" type="range" min="78" max="125" value="100"></div>
    <div class="row"><label for="headHeight">Hauteur du crâne</label><input id="headHeight" type="range" min="78" max="125" value="100"></div>
    <div class="row"><label for="jawLength">Longueur de mâchoire</label><input id="jawLength" type="range" min="72" max="138" value="100"></div>
    <div class="row"><label for="jawWidth">Largeur de mâchoire</label><input id="jawWidth" type="range" min="75" max="125" value="100"></div>
    <div class="switches">
      <label><input id="showVolume" type="checkbox" checked> Volume</label>
      <label><input id="showWire" type="checkbox" checked> Structure</label>
      <label><input id="showPlanes" type="checkbox" checked> Plans</label>
      <label><input id="showJaw" type="checkbox" checked> Mâchoire</label>
    </div>
  </div>
</footer>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";

const $=id=>document.getElementById(id);
const stage=$("stage"),wrap=$("canvasWrap"),photo=$("photo"),empty=$("empty"),tip=$("tip");

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-4,4,4,-4,.1,100);
camera.position.set(0,0,10);camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.45));
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(4,5,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc8ff,.65);fill.position.set(-4,1,3);scene.add(fill);

const head=new THREE.Group();scene.add(head);
const volumeGroup=new THREE.Group(),wireGroup=new THREE.Group(),planeGroup=new THREE.Group(),jawGroup=new THREE.Group();
head.add(volumeGroup,wireGroup,planeGroup,jawGroup);

let volumeMaterials=[],lineMaterials=[];
let shape={w:1,h:1,jl:1,jw:1};

function clearGroup(g){
  while(g.children.length){
    const o=g.children.pop();o.geometry?.dispose();o.material?.dispose?.();
  }
}
function vm(color=0xd9dee1,opacity=.24){
  const m=new THREE.MeshPhongMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false,shininess:12});
  volumeMaterials.push(m);return m;
}
function lm(color=0xff5b48){
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:.92,depthTest:true,depthWrite:false});
  lineMaterials.push(m);return m;
}
function addLine(g,pts,color){
  const o=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm(color));
  o.renderOrder=4;g.add(o);return o;
}
function ellipse(rx,ry,z=0,n=120){
  const pts=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rx,Math.sin(a)*ry,z))}
  return pts;
}
function bezier(a,b,c,d,n=60){return new THREE.CubicBezierCurve3(a,b,c,d).getPoints(n)}

function build(){
  volumeMaterials=[];lineMaterials=[];
  [volumeGroup,wireGroup,planeGroup,jawGroup].forEach(clearGroup);

  const sx=1.68*shape.w,sy=1.92*shape.h,sz=1.52*shape.w;

  // Boîte crânienne plus aplatie sur les côtés
  const skullGeo=new THREE.SphereGeometry(1,64,40);
  skullGeo.scale(sx,sy,sz);
  const skull=new THREE.Mesh(skullGeo,vm(0xd9dee1,.24));
  skull.scale.z=.96;
  volumeGroup.add(skull);

  // Front plus plat et légèrement incliné
  const foreheadGeo=new THREE.BoxGeometry(2.05*shape.w,.90*shape.h,.30*shape.w);
  foreheadGeo.translate(0,.85,sz*.84);
  foreheadGeo.rotateX(-.15);
  const forehead=new THREE.Mesh(foreheadGeo,vm(0xcfd6da,.28));
  volumeGroup.add(forehead);

  // Arcades / masse sourcilière
  const browGeo=new THREE.BoxGeometry(2.2*shape.w,.28,.38*shape.w);
  browGeo.translate(0,.18,sz*.98);
  const brow=new THREE.Mesh(browGeo,vm(0xbfc8cd,.33));
  volumeGroup.add(brow);

  // Pommettes
  [-1,1].forEach(side=>{
    const cheekGeo=new THREE.BoxGeometry(.58*shape.w,.42,.50*shape.w);
    cheekGeo.translate(side*.83*shape.w,-.62,sz*.86);
    cheekGeo.rotateY(side*.18);
    const cheek=new THREE.Mesh(cheekGeo,vm(0xc4ccd1,.30));
    volumeGroup.add(cheek);
  });

  // Plans latéraux
  const sideR=.66*Math.min(shape.w,shape.h);
  const pGeo=new THREE.CylinderGeometry(sideR,sideR,.10,64,1,false);
  pGeo.rotateZ(Math.PI/2);
  const lp=new THREE.Mesh(pGeo,vm(0xb5bec4,.38));lp.position.set(-sx*.77,.02,0);
  const rp=new THREE.Mesh(pGeo,vm(0xb5bec4,.38));rp.position.set(sx*.77,.02,0);
  planeGroup.add(lp,rp);

  // Orbites pour rendre la lecture plus crânienne
  [-1,1].forEach(side=>{
    const ring=new THREE.TorusGeometry(.42,.045,10,64);
    ring.scale(1,.82,1);
    const mesh=new THREE.Mesh(ring,vm(0xffc06b,.55));
    mesh.position.set(side*.55,-.18,sz*1.03);
    mesh.rotation.x=Math.PI/2;
    planeGroup.add(mesh);
  });

  // Nez osseux simplifié
  const noseGeo=new THREE.ConeGeometry(.25,.90,4);
  noseGeo.rotateX(Math.PI/2);
  noseGeo.position.set(0,-.45,sz*1.24);
  const nose=new THREE.Mesh(noseGeo,vm(0xc9d0d4,.34));
  volumeGroup.add(nose);

  // Mâchoire plus anguleuse
  const jawTop=-.10,jawY=-1.72*shape.jl,chinY=-2.60*shape.jl,jx=1.08*shape.jw,zf=sz*.70,zb=-sz*.18;
  const verts=[
    -sx*.72,jawTop,zf, sx*.72,jawTop,zf,
    -jx,jawY,zf*.78, jx,jawY,zf*.78,
    0,chinY,zf*.55,
    -sx*.65,jawTop,zb, sx*.65,jawTop,zb,
    -jx*.84,jawY,zb, jx*.84,jawY,zb,
    0,chinY,zb
  ];
  const idx=[
    0,2,1,1,2,3,2,4,3,
    5,6,7,6,8,7,7,8,9,
    0,5,2,5,7,2,
    1,3,6,6,3,8,
    2,7,4,7,9,4,
    3,4,8,8,4,9
  ];
  const jGeo=new THREE.BufferGeometry();
  jGeo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  jGeo.setIndex(idx);jGeo.computeVertexNormals();
  jawGroup.add(new THREE.Mesh(jGeo,vm(0xc8cfd3,.27)));

  // Lignes Loomis réellement attachées au volume
  addLine(wireGroup,ellipse(sx,sy,0),0xff5b48);
  addLine(wireGroup,ellipse(sy,sz,0).map(p=>new THREE.Vector3(0,p.x,p.y)),0xff8c7e);
  addLine(wireGroup,ellipse(sx,sz,0).map(p=>new THREE.Vector3(p.x,0,p.y)),0xff9d92);

  // Axe central avant courbé
  const axis=[];
  for(let i=0;i<=90;i++){
    const t=-1+i/90*2;
    const y=t*sy;
    const z=Math.sqrt(Math.max(0,1-(y*y)/(sy*sy)))*sz;
    axis.push(new THREE.Vector3(0,y,z));
  }
  addLine(wireGroup,axis,0x70dcae);

  // Repères horizontaux sur le volume avant
  const levels=[.18,-.25,-.78,-1.18];
  levels.forEach((y,idx2)=>{
    const yy=y*shape.h;
    const n=Math.max(0,1-(yy*yy)/(sy*sy));
    const rx=Math.sqrt(n)*sx,rz=Math.sqrt(n)*sz;
    const pts=[];
    for(let i=0;i<=90;i++){
      const a=Math.PI-(i/90)*Math.PI;
      pts.push(new THREE.Vector3(Math.cos(a)*rx,yy,Math.sin(a)*rz));
    }
    addLine(wireGroup,pts,idx2===1?0x69bdf0:0xff887b);
  });

  // Contours des plans latéraux
  [-1,1].forEach(side=>{
    const pts=[];
    for(let i=0;i<=100;i++){
      const a=i/100*Math.PI*2;
      pts.push(new THREE.Vector3(side*sx*.77,Math.cos(a)*sideR,Math.sin(a)*sideR));
    }
    addLine(planeGroup,pts,0xffc06b);
  });

  // Contours mâchoire
  addLine(jawGroup,bezier(
    new THREE.Vector3(-sx*.72,jawTop,zf),
    new THREE.Vector3(-sx*.82,-.70,zf*.92),
    new THREE.Vector3(-jx,jawY,zf*.78),
    new THREE.Vector3(0,chinY,zf*.55)
  ),0xff5b48);
  addLine(jawGroup,bezier(
    new THREE.Vector3(sx*.72,jawTop,zf),
    new THREE.Vector3(sx*.82,-.70,zf*.92),
    new THREE.Vector3(jx,jawY,zf*.78),
    new THREE.Vector3(0,chinY,zf*.55)
  ),0xff5b48);

  applyVisibility();applyOpacity();
}

function applyVisibility(){
  volumeGroup.visible=$("showVolume").checked;
  wireGroup.visible=$("showWire").checked;
  planeGroup.visible=$("showPlanes").checked;
  jawGroup.visible=$("showJaw").checked;
}
function applyOpacity(){
  const vo=Number($("opacity").value)/100;
  const lo=Number($("lineOpacity").value)/100;
  volumeMaterials.forEach(m=>m.opacity=vo);
  lineMaterials.forEach(m=>m.opacity=lo);
}
function syncRotation(){
  head.rotation.set(
    THREE.MathUtils.degToRad(Number($("pitch").value)),
    THREE.MathUtils.degToRad(Number($("yaw").value)),
    THREE.MathUtils.degToRad(Number($("roll").value))
  );
}

build();

let mode="move",dragging=false,start={x:0,y:0},startPos=new THREE.Vector3(),startRot=new THREE.Euler(),startScale=1,pinch=null;
function setMode(m){
  mode=m;
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  tip.textContent=m==="move"?"Glisse pour déplacer la tête":m==="rotate"?"Glisse pour tourner. Utilise ⚙️ pour l'inclinaison latérale":"Glisse verticalement ou pince pour changer la taille";
}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

function pxy(e){
  const r=stage.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
}
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest("button,label,input"))return;
  stage.setPointerCapture(e.pointerId);dragging=true;start=pxy(e);
  startPos.copy(head.position);startRot.copy(head.rotation);startScale=head.scale.x;
});
stage.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=pxy(e),dx=p.x-start.x,dy=p.y-start.y;
  if(mode==="move"){
    head.position.x=startPos.x+dx*8;head.position.y=startPos.y-dy*8;
  }else if(mode==="rotate"){
    head.rotation.y=startRot.y+dx*Math.PI*1.8;
    head.rotation.x=startRot.x+dy*Math.PI*1.25;
    $("yaw").value=Math.round(THREE.MathUtils.radToDeg(head.rotation.y));
    $("pitch").value=Math.round(THREE.MathUtils.radToDeg(head.rotation.x));
  }else{
    const s=Math.max(.22,Math.min(3,startScale-dy*2.8));head.scale.setScalar(s);
  }
});
["pointerup","pointercancel"].forEach(ev=>stage.addEventListener(ev,()=>dragging=false));

stage.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:head.scale.x};
  }
},{passive:true});
stage.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinch){
    const[a,b]=e.touches;const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    head.scale.setScalar(Math.max(.22,Math.min(3,pinch.s*d/pinch.d)));
  }
},{passive:true});
stage.addEventListener("touchend",()=>pinch=null,{passive:true});

document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
  const p=b.dataset.preset;
  let yaw=0,pitch=0,roll=0;
  if(p==="three")yaw=38;
  if(p==="profile")yaw=90;
  if(p==="back")yaw=180;
  $("yaw").value=yaw;$("pitch").value=pitch;$("roll").value=roll;syncRotation();
}));

["yaw","pitch","roll"].forEach(id=>$(id).addEventListener("input",syncRotation));
$("file").addEventListener("change",e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{photo.src=r.result;empty.style.display="none"};r.readAsDataURL(f);
});
$("settings").addEventListener("click",()=>$("panel").classList.toggle("open"));
["showVolume","showWire","showPlanes","showJaw"].forEach(id=>$(id).addEventListener("input",applyVisibility));
["opacity","lineOpacity"].forEach(id=>$(id).addEventListener("input",applyOpacity));
$("headWidth").addEventListener("input",()=>{shape.w=Number($("headWidth").value)/100;build()});
$("headHeight").addEventListener("input",()=>{shape.h=Number($("headHeight").value)/100;build()});
$("jawLength").addEventListener("input",()=>{shape.jl=Number($("jawLength").value)/100;build()});
$("jawWidth").addEventListener("input",()=>{shape.jw=Number($("jawWidth").value)/100;build()});

$("reset").addEventListener("click",()=>{
  head.position.set(0,0,0);head.scale.setScalar(1);
  ["yaw","pitch","roll"].forEach(id=>$(id).value=0);syncRotation();
  shape={w:1,h:1,jl:1,jw:1};
  $("headWidth").value=100;$("headHeight").value=100;$("jawLength").value=100;$("jawWidth").value=100;
  $("opacity").value=24;$("lineOpacity").value=92;build();setMode("move");
});

$("export").addEventListener("click",()=>{
  renderer.render(scene,camera);
  const out=document.createElement("canvas");
  out.width=renderer.domElement.width;out.height=renderer.domElement.height;
  const c=out.getContext("2d");
  if(photo.src){
    const ar=photo.naturalWidth/photo.naturalHeight,sr=out.width/out.height;
    let dw,dh,dx,dy;
    if(ar>sr){dw=out.width;dh=dw/ar;dx=0;dy=(out.height-dh)/2}
    else{dh=out.height;dw=dh*ar;dy=0;dx=(out.width-dw)/2}
    c.drawImage(photo,dx,dy,dw,dh);
  }
  c.drawImage(renderer.domElement,0,0,out.width,out.height);
  const a=document.createElement("a");a.download="loomi-3d-skull-v2.png";a.href=out.toDataURL("image/png");a.click();
});

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h,false);
  const v=4,ar=w/h;camera.left=-v*ar;camera.right=v*ar;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);resize();

(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)})();
</script>
</body>
</html>
