<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Loomi 3D Skull V1</title>
<style>
:root{
  --bg:#080b0e;--panel:#10161a;--line:#2e3941;--text:#f4f7f8;
  --muted:#aeb8bd;--accent:#ff5b48;--soft:#ff9a8d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#101519;border-bottom:1px solid var(--line)}
.brand{font-weight:850}.brand b{color:var(--accent)}
.status{font-size:12px;color:#75d3aa}
.stage{position:relative;min-height:0;background:#020304;overflow:hidden;touch-action:none}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
#canvasWrap{position:absolute;inset:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px;pointer-events:none}
.empty b{display:block;color:#fff;font-size:21px;margin-bottom:7px}
.topbar{position:absolute;z-index:6;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.file{position:relative;display:inline-flex}
.file input{position:absolute;inset:0;opacity:0}
.btn{border:1px solid #46535b;background:#10161acc;color:#fff;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}
.btn.primary{background:var(--accent);border-color:transparent}
.tip{position:absolute;z-index:4;top:64px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#0f1519d8;border:1px solid #3d4950;border-radius:999px;padding:7px 12px;font-size:12px;color:#e1e5e7;pointer-events:none}
.bottom{background:#101519;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button,.presets button{border:1px solid #44515a;background:#20272c;color:#fff;border-radius:12px;padding:11px 7px}
.modes button.active{background:var(--accent);border-color:transparent}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.presets button{font-size:12px;padding:8px 5px}
.panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);gap:10px}
.panel.open{display:grid}
.row{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px}
.row label{font-size:13px}.row input[type=range]{width:100%}
.switches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.switches label{font-size:12px;color:#dfe4e6;display:flex;gap:7px;align-items:center}
@media(min-width:850px){
  .app{max-width:1100px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .bottom{display:grid;grid-template-columns:380px 1fr;gap:16px}
  .panel{display:grid;margin:0;padding:0;border:0}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Loomi 3D <b>Skull V1</b></div>
  <div class="status">Volume réel</div>
</header>

<section id="stage" class="stage">
  <img id="photo" alt="">
  <div id="canvasWrap"></div>

  <div class="topbar">
    <label class="file btn primary">📷 Photo<input id="file" type="file" accept="image/*"></label>
    <div style="display:flex;gap:7px">
      <button id="reset" class="btn">↺</button>
      <button id="settings" class="btn">⚙️</button>
      <button id="export" class="btn">Exporter</button>
    </div>
  </div>

  <div id="tip" class="tip">Glisse pour déplacer la tête</div>
  <div id="empty" class="empty"><div><b>Ajoute une photo</b>Puis pose le crâne Loomis 3D dessus.</div></div>
</section>

<footer class="bottom">
  <div>
    <div class="modes">
      <button class="mode active" data-mode="move">Déplacer</button>
      <button class="mode" data-mode="rotate">Tourner 360°</button>
      <button class="mode" data-mode="scale">Taille</button>
    </div>
    <div class="presets">
      <button data-preset="front">Face</button>
      <button data-preset="three">3/4</button>
      <button data-preset="profile">Profil</button>
      <button data-preset="back">Dos</button>
    </div>
  </div>

  <div id="panel" class="panel">
    <div class="row"><label for="opacity">Transparence du volume</label><input id="opacity" type="range" min="8" max="70" value="27"></div>
    <div class="row"><label for="lineOpacity">Force des lignes</label><input id="lineOpacity" type="range" min="20" max="100" value="90"></div>
    <div class="row"><label for="headWidth">Largeur du crâne</label><input id="headWidth" type="range" min="78" max="125" value="100"></div>
    <div class="row"><label for="headHeight">Hauteur du crâne</label><input id="headHeight" type="range" min="78" max="125" value="100"></div>
    <div class="row"><label for="jawLength">Longueur de mâchoire</label><input id="jawLength" type="range" min="72" max="138" value="100"></div>
    <div class="row"><label for="jawWidth">Largeur de mâchoire</label><input id="jawWidth" type="range" min="75" max="125" value="100"></div>
    <div class="switches">
      <label><input id="showVolume" type="checkbox" checked> Volume</label>
      <label><input id="showWire" type="checkbox" checked> Structure</label>
      <label><input id="showPlanes" type="checkbox" checked> Plans latéraux</label>
      <label><input id="showJaw" type="checkbox" checked> Mâchoire</label>
    </div>
  </div>
</footer>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";

const $=id=>document.getElementById(id);
const stage=$("stage"), wrap=$("canvasWrap"), photo=$("photo"), empty=$("empty"), tip=$("tip");

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-4,4,4,-4,.1,100);
camera.position.set(0,0,10);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
wrap.appendChild(renderer.domElement);

const head=new THREE.Group();
scene.add(head);

const volumeGroup=new THREE.Group();
const wireGroup=new THREE.Group();
const planeGroup=new THREE.Group();
const jawGroup=new THREE.Group();
head.add(volumeGroup,wireGroup,planeGroup,jawGroup);

let volumeMaterials=[], lineMaterials=[];
let shape={w:1,h:1,jl:1,jw:1};

function clearGroup(g){
  while(g.children.length){
    const o=g.children.pop();
    o.geometry?.dispose();
    if(o.material && !Array.isArray(o.material)) o.material.dispose?.();
  }
}
function lineMat(color=0xff5b48){
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:.9,depthTest:true,depthWrite:false});
  lineMaterials.push(m); return m;
}
function volumeMat(color=0xd8dde0,opacity=.27){
  const m=new THREE.MeshPhongMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false,shininess:18});
  volumeMaterials.push(m); return m;
}
function addLine(group,pts,color){
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const obj=new THREE.Line(geo,lineMat(color));
  obj.renderOrder=3; group.add(obj); return obj;
}
function circleOnSphere(axis,value,radius,scaleX=1,scaleY=1,n=120){
  const pts=[];
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2;
    const c=Math.cos(a),s=Math.sin(a);
    if(axis==="y") pts.push(new THREE.Vector3(c*radius*scaleX,value,s*radius*scaleY));
    if(axis==="x") pts.push(new THREE.Vector3(value,c*radius*scaleX,s*radius*scaleY));
    if(axis==="z") pts.push(new THREE.Vector3(c*radius*scaleX,s*radius*scaleY,value));
  }
  return pts;
}
function bezier(a,b,c,d,n=60){
  return new THREE.CubicBezierCurve3(a,b,c,d).getPoints(n);
}

function build(){
  volumeMaterials=[]; lineMaterials=[];
  [volumeGroup,wireGroup,planeGroup,jawGroup].forEach(clearGroup);

  const sx=1.72*shape.w, sy=1.95*shape.h, sz=1.58*shape.w;

  // Crâne ovoïde réellement volumique
  const skullGeo=new THREE.SphereGeometry(1,64,40);
  skullGeo.scale(sx,sy,sz);
  const skull=new THREE.Mesh(skullGeo,volumeMat(0xd9dee1,.27));
  skull.renderOrder=1;
  volumeGroup.add(skull);

  // Plans latéraux légèrement enfoncés
  const sideRadius=.67*Math.min(shape.w,shape.h);
  const planeGeo=new THREE.CylinderGeometry(sideRadius,sideRadius,.08,64,1,false);
  planeGeo.rotateZ(Math.PI/2);

  const lp=new THREE.Mesh(planeGeo,volumeMat(0xb7c0c6,.38));
  lp.position.set(-sx*.77,.04,0); lp.renderOrder=2;
  const rp=lp.clone(); rp.material=volumeMat(0xb7c0c6,.38); rp.position.x=sx*.77;
  planeGroup.add(lp,rp);

  // Structure du crâne, attachée au volume
  addLine(wireGroup,circleOnSphere("z",0,1,sx,sy),0xff5b48);
  addLine(wireGroup,circleOnSphere("x",0,1,sy,sz).map(p=>new THREE.Vector3(p.x,p.y,p.z)),0xff8c7e);
  addLine(wireGroup,circleOnSphere("y",0,1,sx,sz),0xff9d92);

  // Méridiens avant et 3/4
  [-.55,0,.55].forEach(k=>{
    const pts=[];
    for(let i=0;i<=100;i++){
      const t=-Math.PI/2+i/100*Math.PI;
      const y=Math.sin(t)*sy;
      const z=Math.cos(t)*sz;
      const x=k*sx*Math.cos(t);
      pts.push(new THREE.Vector3(x,y,z));
    }
    addLine(wireGroup,pts,k===0?0x6ee0ae:0xff8374);
  });

  // Lignes Loomis courbes sur le volume avant
  const levels=[.18,-.25,-.78,-1.18];
  levels.forEach((y,idx)=>{
    const yy=y*shape.h;
    const norm=Math.max(0,1-(yy*yy)/(sy*sy));
    const rx=Math.sqrt(norm)*sx;
    const rz=Math.sqrt(norm)*sz;
    const pts=[];
    for(let i=0;i<=90;i++){
      const a=Math.PI-(i/90)*Math.PI;
      pts.push(new THREE.Vector3(Math.cos(a)*rx,yy,Math.sin(a)*rz));
    }
    addLine(wireGroup,pts,idx===1?0x69bdf0:0xff887b);
  });

  // Contours des plans latéraux
  [-1,1].forEach(side=>{
    const pts=[];
    for(let i=0;i<=100;i++){
      const a=i/100*Math.PI*2;
      pts.push(new THREE.Vector3(side*sx*.78,Math.cos(a)*sideRadius,Math.sin(a)*sideRadius));
    }
    addLine(planeGroup,pts,0xffc06b);
  });

  // Mâchoire en volume léger
  const jawTopY=-.08, jawY=-1.78*shape.jl, chinY=-2.62*shape.jl;
  const jx=1.12*shape.jw, zFront=sz*.63, zBack=-sz*.22;
  const verts=[
    -sx*.76,jawTopY,zFront,   sx*.76,jawTopY,zFront,
    -jx,jawY,zFront*.75,      jx,jawY,zFront*.75,
    0,chinY,zFront*.52,
    -sx*.70,jawTopY,zBack,    sx*.70,jawTopY,zBack,
    -jx*.88,jawY,zBack,       jx*.88,jawY,zBack,
    0,chinY,zBack
  ];
  const idx=[
    0,2,1, 1,2,3, 2,4,3,
    5,6,7, 6,8,7, 7,8,9,
    0,5,2, 5,7,2,
    1,3,6, 6,3,8,
    2,7,4, 7,9,4,
    3,4,8, 8,4,9
  ];
  const jawGeo=new THREE.BufferGeometry();
  jawGeo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  jawGeo.setIndex(idx); jawGeo.computeVertexNormals();
  const jawMesh=new THREE.Mesh(jawGeo,volumeMat(0xc8cfd3,.26));
  jawMesh.renderOrder=1; jawGroup.add(jawMesh);

  // Contours mâchoire
  const frontLeft=bezier(
    new THREE.Vector3(-sx*.76,jawTopY,zFront),
    new THREE.Vector3(-sx*.82,-.75,zFront*.95),
    new THREE.Vector3(-jx,jawY,zFront*.75),
    new THREE.Vector3(0,chinY,zFront*.52)
  );
  const frontRight=bezier(
    new THREE.Vector3(sx*.76,jawTopY,zFront),
    new THREE.Vector3(sx*.82,-.75,zFront*.95),
    new THREE.Vector3(jx,jawY,zFront*.75),
    new THREE.Vector3(0,chinY,zFront*.52)
  );
  addLine(jawGroup,frontLeft,0xff5b48);
  addLine(jawGroup,frontRight,0xff5b48);

  // Nez simplifié en structure pour comprendre l'orientation
  const nosePts=[
    new THREE.Vector3(0,.05,sz*1.00),
    new THREE.Vector3(0,-.72,sz*1.34),
    new THREE.Vector3(-.24,-.83,sz*1.18),
    new THREE.Vector3(.24,-.83,sz*1.18),
    new THREE.Vector3(0,-.72,sz*1.34)
  ];
  addLine(wireGroup,nosePts,0xffc06b);

  applyVisibility();
  applyOpacity();
}
function applyVisibility(){
  volumeGroup.visible=$("showVolume").checked;
  wireGroup.visible=$("showWire").checked;
  planeGroup.visible=$("showPlanes").checked;
  jawGroup.visible=$("showJaw").checked;
}
function applyOpacity(){
  const vo=Number($("opacity").value)/100;
  const lo=Number($("lineOpacity").value)/100;
  volumeMaterials.forEach(m=>m.opacity=vo);
  lineMaterials.forEach(m=>m.opacity=lo);
}
build();

scene.add(new THREE.AmbientLight(0xffffff,1.4));
const key=new THREE.DirectionalLight(0xffffff,1.8);
key.position.set(3,4,6); scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc8ff,.8);
fill.position.set(-4,1,3); scene.add(fill);

let mode="move",dragging=false,start={x:0,y:0},startPos=new THREE.Vector3(),startRot=new THREE.Euler(),startScale=1,pinch=null;

function setMode(m){
  mode=m;
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  tip.textContent=m==="move"?"Glisse pour déplacer la tête":m==="rotate"?"Glisse pour tourner le crâne en 3D":"Glisse verticalement ou pince pour changer la taille";
}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

function pointerXY(e){
  const r=stage.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
}
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest("button,label,input"))return;
  stage.setPointerCapture(e.pointerId);
  dragging=true; start=pointerXY(e);
  startPos.copy(head.position);startRot.copy(head.rotation);startScale=head.scale.x;
});
stage.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=pointerXY(e),dx=p.x-start.x,dy=p.y-start.y;
  if(mode==="move"){
    head.position.x=startPos.x+dx*8;
    head.position.y=startPos.y-dy*8;
  }else if(mode==="rotate"){
    head.rotation.y=startRot.y+dx*Math.PI*1.8;
    head.rotation.x=startRot.x+dy*Math.PI*1.25;
  }else{
    const s=Math.max(.22,Math.min(3,startScale-dy*2.8));
    head.scale.setScalar(s);
  }
});
["pointerup","pointercancel"].forEach(ev=>stage.addEventListener(ev,()=>dragging=false));

stage.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    const [a,b]=e.touches;
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:head.scale.x};
  }
},{passive:true});
stage.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinch){
    const [a,b]=e.touches;
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const s=Math.max(.22,Math.min(3,pinch.s*d/pinch.d));
    head.scale.setScalar(s);
  }
},{passive:true});
stage.addEventListener("touchend",()=>pinch=null,{passive:true});

document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
  const p=b.dataset.preset;head.rotation.set(0,0,0);
  if(p==="three")head.rotation.set(-.05,.68,-.03);
  if(p==="profile")head.rotation.set(0,Math.PI/2,0);
  if(p==="back")head.rotation.set(0,Math.PI,0);
}));

$("file").addEventListener("change",e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{photo.src=r.result;empty.style.display="none"};
  r.readAsDataURL(f);
});
$("settings").addEventListener("click",()=>$("panel").classList.toggle("open"));
["showVolume","showWire","showPlanes","showJaw"].forEach(id=>$(id).addEventListener("input",applyVisibility));
["opacity","lineOpacity"].forEach(id=>$(id).addEventListener("input",applyOpacity));
$("headWidth").addEventListener("input",()=>{shape.w=Number($("headWidth").value)/100;build()});
$("headHeight").addEventListener("input",()=>{shape.h=Number($("headHeight").value)/100;build()});
$("jawLength").addEventListener("input",()=>{shape.jl=Number($("jawLength").value)/100;build()});
$("jawWidth").addEventListener("input",()=>{shape.jw=Number($("jawWidth").value)/100;build()});

$("reset").addEventListener("click",()=>{
  head.position.set(0,0,0);head.rotation.set(0,0,0);head.scale.setScalar(1);
  shape={w:1,h:1,jl:1,jw:1};
  $("headWidth").value=100;$("headHeight").value=100;$("jawLength").value=100;$("jawWidth").value=100;
  $("opacity").value=27;$("lineOpacity").value=90;build();setMode("move");
});

$("export").addEventListener("click",()=>{
  renderer.render(scene,camera);
  const out=document.createElement("canvas");
  out.width=renderer.domElement.width;out.height=renderer.domElement.height;
  const c=out.getContext("2d");
  if(photo.src){
    const ar=photo.naturalWidth/photo.naturalHeight,sr=out.width/out.height;
    let dw,dh,dx,dy;
    if(ar>sr){dw=out.width;dh=dw/ar;dx=0;dy=(out.height-dh)/2}
    else{dh=out.height;dw=dh*ar;dy=0;dx=(out.width-dw)/2}
    c.drawImage(photo,dx,dy,dw,dh);
  }
  c.drawImage(renderer.domElement,0,0,out.width,out.height);
  const a=document.createElement("a");a.download="loomi-3d-skull.png";a.href=out.toDataURL("image/png");a.click();
});

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false);
  const v=4,ar=w/h;
  camera.left=-v*ar;camera.right=v*ar;camera.top=v;camera.bottom=-v;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);resize();

(function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
